services:
  qbitrr:
    container_name: qbitrr
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:6969/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    image: feramance/qbitrr:v5.14.6-1
    tty: true
    restart: unless-stopped
    networks:
      - frontend
    environment:
      - TZ=$TZ
      - PUID=$PUID
      - PGID=$PGID
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - $DOCKERDIR/appdata/qbitrr/config:/config
      - $DATADIR/downloads:/media/downloads:rw
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: 3
    depends_on:
      - qbittorrent
      - radarr
      - sonarr
      - jellyseerr
