services:
  litkeeper:
    image: ghcr.io/redwoodstory/litkeeper:3.5.3
    restart: unless-stopped
    container_name: litkeeper
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - frontend
    volumes:
      - $DATADIR/Audio-ePub/ingest:/litkeeper/app/external
      - $APPDIR/litkeeper/data:/litkeeper/app/data
      - $DOCKERDIR/logs/litkeeper:/litkeeper/app/data/logs
    environment:
      - EXTERNAL_EPUB_PATH=/litkeeper/app/external
      - LITKEEPER_API_TOKEN=$LITKEEPER_API_TOKEN
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.litkeeper-https.entrypoints=websecure"
      - "traefik.http.routers.litkeeper-https.rule=Host(`litkeeper.$DOMAINNAME_NA`)"
      - "traefik.http.routers.litkeeper-https.middlewares=chain-lan-only@file"
      - "traefik.http.routers.litkeeper-https.service=litkeeper-svc"
      - "traefik.http.services.litkeeper-svc.loadBalancer.server.port=5000"
