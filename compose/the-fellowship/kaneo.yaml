services:
  kaneo_postgres:
    image: postgres:16-alpine
    container_name: kaneo_postgres
    env_file:
      - $DOCKERDIR/.kaneo.env
    # ports:
    #   - "5432:5432"
    networks:
      - backend
    volumes:
      - $APPDIR/kaneo/db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d kaneo
      interval: 10s
      timeout: 5s
      retries: 5
  kaneo:
    image: ghcr.io/usekaneo/kaneo:2.7.0
    container_name: kaneo
    networks:
      - backend
      - frontend
    env_file:
      - $DOCKERDIR/.kaneo.env
    depends_on:
      kaneo_postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:1337/api/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kaneo-web-rtr.entrypoints=websecure"
      - "traefik.http.routers.kaneo-web-rtr.rule=Host(`plan.$DOMAINNAME_J`)"
      - "traefik.http.routers.kaneo-web-rtr.middlewares=chain-no-auth-redirect@\
        file"
      - "traefik.http.routers.kaneo-web-rtr.service=kaneo-web-svc"
      - "traefik.http.services.kaneo-web-svc.loadBalancer.server.port=5173"
